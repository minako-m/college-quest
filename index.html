<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Azhar's College Quest</title>
  <meta name="theme-color" content="#FDF4FB">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-paw" aria-hidden="true">🐾</span><span><span id="brand-name">Azhar</span>’s <span class="brand-long">College </span>Quest</span></div>
    <div class="stats">
      <div class="pill pill-stars" title="Points"><span aria-hidden="true">⭐</span><span id="points">0</span></div>
      <button id="sticker-pill" class="pill pill-stickers" type="button" title="My sticker book" aria-label="Open my sticker book"><span aria-hidden="true">🎀</span><span id="stickers">0/10</span></button>
      <button id="reset-btn" class="icon-btn" type="button" title="Start over" aria-label="Start over">↺</button>
    </div>
  </header>

  <main class="map-wrap">
    <svg id="map" viewBox="0 0 400 1720" role="img" aria-label="Quest map with 10 stops">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E7DEFF"/>
          <stop offset=".35" stop-color="#FCE7F1"/>
          <stop offset=".7" stop-color="#E4F7EE"/>
          <stop offset="1" stop-color="#D3F2E3"/>
        </linearGradient>
        <filter id="faded"><feColorMatrix type="saturate" values="0.35"/></filter>
      </defs>
      <rect width="400" height="1720" fill="url(#sky)"/>
      <g id="bg"></g>
      <g id="road"></g>
      <g id="decor"></g>
      <g id="stops"></g>
      <g id="fx"></g>
      <g id="cat-layer"></g>
    </svg>
  </main>

  <nav class="dock">
    <a id="open-doc" class="dock-btn" target="_blank" rel="noopener">📝 My workbook</a>
    <button id="find-cat" class="dock-btn" type="button">🐱 Find Mochi</button>
    <button id="words-btn" class="dock-btn" type="button">📖 Words</button>
  </nav>

  <div id="overlay" class="overlay" hidden>
    <div id="card" class="card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
  <script src="config.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
